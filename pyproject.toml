[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ddut-research-rag-app"
version = "0.1.0"
description = "Streamlit research RAG app"
dependencies = [
    "streamlit",
    "requests",
    "beautifulsoup4",
    "pandas",
    "reportlab",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
